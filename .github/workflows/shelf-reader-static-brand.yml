name: Brand Shelf Reader static shell

on:
  push:
    branches:
      - shelf-reader-static-brand

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shelf-reader-static-brand

      - name: Align static shell with Shelf imprint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('reader/index.html')
          text = index.read_text(encoding='utf-8')

          old = '''  <meta name="apple-mobile-web-app-title" content="Reader">
          <meta name="format-detection" content="telephone=no">
          <title>Bookself Reader</title>
          <meta name="description" content="Read Bookself publications from a working Desk or released Shelf.">
          '''
          new = '''  <meta name="apple-mobile-web-app-title" content="Sven’s Shelf">
          <meta name="format-detection" content="telephone=no">
          <title>Sven Hardy Benson’s Shelf — Reader</title>
          <meta name="description" content="Books by Sven Hardy Benson on intelligence, institutions, markets, medicine, and changing systems.">
          <link rel="canonical" href="https://svyable.github.io/shelf/reader/">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="Sven Hardy Benson’s Shelf">
          <meta property="og:title" content="Sven Hardy Benson’s Shelf — Reader">
          <meta property="og:description" content="Released editions by Sven Hardy Benson, built for sustained reading.">
          <meta property="og:url" content="https://svyable.github.io/shelf/reader/">
          <meta name="twitter:card" content="summary">
          <meta name="twitter:title" content="Sven Hardy Benson’s Shelf — Reader">
          <meta name="twitter:description" content="Released editions by Sven Hardy Benson, built for sustained reading.">
          '''
          if old not in text:
              raise SystemExit('static head anchor not found')
          text = text.replace(old, new, 1)

          old = '<button class="logo" id="logoBtn" type="button" title="Bookself" aria-label="Bookself">'
          new = '<button class="logo" id="logoBtn" type="button" title="Sven Hardy Benson’s Shelf" aria-label="Sven Hardy Benson’s Shelf">'
          if old not in text:
              raise SystemExit('logo anchor not found')
          text = text.replace(old, new, 1)

          old = '''          <p class="library-kicker">Written in Markdown · Read like a book</p>
                    <h1>Bookself</h1>
                    <p class="library-lede">Publications live as plain Markdown. The Reader can open a working Desk proof or a deliberately released Shelf edition.</p>
                    <p class="library-actions">
                      <a class="write-link" id="writeLink" href="../desk/">Open the Publishing Desk</a>
                      <a class="write-link" id="forkLink" hidden href="https://svyable.github.io/shelf/reader/">See a live Shelf</a>
                    </p>
          '''
          new = '''          <p class="library-kicker">Books by Sven Hardy Benson · Read like books</p>
                    <h1>Sven Hardy Benson’s Shelf</h1>
                    <p class="library-lede">Released editions built for sustained reading. Search the library, keep your place, take notes, cite passages, and return whenever you like.</p>
                    <p class="library-actions">
                      <a class="write-link" id="writeLink" href="https://svyable.github.io/desk/">Working drafts</a>
                      <a class="write-link" id="forkLink" hidden href="https://svyable.github.io/shelf/reader/">See a live Shelf</a>
                    </p>
                    <p class="library-trust">Your position, bookmarks, notes, and presentation preferences stay in this browser.</p>
          '''
          if old not in text:
              raise SystemExit('library hero anchor not found')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          css = Path('reader/css/shelf-gui.css')
          text = css.read_text(encoding='utf-8')
          old = '''body[data-stage="library"] .library-actions {
            gap: .7rem;
            margin-bottom: clamp(1.8rem, 3vw, 2.6rem);
          }
          '''
          new = '''body[data-stage="library"] .library-actions {
            gap: .7rem;
            margin-bottom: .85rem;
          }

          body[data-stage="library"] .library-trust {
            max-width: 52rem;
            margin: 0 0 clamp(1.8rem, 3vw, 2.6rem);
            color: var(--text-muted);
            font-family: var(--font-ui);
            font-size: .82rem;
            line-height: 1.5;
          }
          '''
          if old not in text:
              raise SystemExit('library actions CSS anchor not found')
          css.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate static Shelf identity
        run: |
          grep -q '<title>Sven Hardy Benson’s Shelf — Reader</title>' reader/index.html
          grep -q 'property="og:site_name" content="Sven Hardy Benson’s Shelf"' reader/index.html
          grep -q 'class="library-trust"' reader/index.html
          grep -q 'Your position, bookmarks, notes, and presentation preferences stay in this browser.' reader/index.html
          test "$(grep -c 'rel="canonical"' reader/index.html)" -eq 1
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --check

      - name: Commit static Shelf shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader/index.html reader/css/shelf-gui.css
          git commit -m "Brand the Shelf Reader static shell"
          git push origin HEAD:shelf-reader-static-brand
