name: Publish Keep Cooking once

on:
  push:
    branches:
      - release/keep-cooking

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publication-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf release branch
        uses: actions/checkout@v4
        with:
          ref: release/keep-cooking
          path: shelf
          fetch-depth: 0

      - name: Check out the committed Desk snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Svyable/desk.git desk
          git -C desk checkout --quiet 438b720e62d279ecc83ae8fc81fdd7e4f074aa2f

      - name: Prepare the Shelf release with the canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python3 desk/scripts/release-book.py keep-cooking "$GITHUB_WORKSPACE/shelf"

      - name: Remove the one-shot workflow and commit the generated release
        shell: bash
        run: |
          set -euo pipefail
          rm -f shelf/.github/workflows/publish-keep-cooking-once.yml
          git -C shelf config user.name 'Svyable Release Automation'
          git -C shelf config user.email '129682319+Svyable@users.noreply.github.com'
          git -C shelf add README.md books/keep-cooking .github/workflows/publish-keep-cooking-once.yml
          git -C shelf diff --cached --check -- ':!books/keep-cooking/RIGHTS.md'
          git -C shelf commit -m 'Publish Keep Cooking [publication-generated]'
          git -C shelf push origin HEAD:release/keep-cooking
