name: Publish Restructuring America once

on:
  push:
    branches:
      - release/restructuring-america

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publication-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf release branch
        uses: actions/checkout@v4
        with:
          ref: release/restructuring-america
          path: shelf
          fetch-depth: 0

      - name: Check out the committed Desk snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Svyable/desk.git desk
          git -C desk checkout --quiet bc891f8b3b691ca0d47d9fb070838b8bcdbd19f2

      - name: Prepare the Shelf release with the canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python3 desk/scripts/release-book.py restructuring-america "$GITHUB_WORKSPACE/shelf"

      - name: Normalize Shelf-facing publication metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          book = Path('shelf/books/restructuring-america')

          readme = book / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace('| **Publication Surface** | Svyable Desk |', '| **Publication Surface** | Shelf |')
          readme.write_text(text, encoding='utf-8')

          rights_md = book / 'RIGHTS.md'
          text = rights_md.read_text(encoding='utf-8')
          text = text.replace('**Publication Surface:** Desk', '**Publication Surface:** Shelf')
          rights_md.write_text(text, encoding='utf-8')

          rights_json = book / 'rights.json'
          data = json.loads(rights_json.read_text(encoding='utf-8'))
          data['publication_surface'] = 'Shelf'
          rights_json.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Remove the one-shot workflow and commit the generated release
        shell: bash
        run: |
          set -euo pipefail
          rm -f shelf/.github/workflows/publish-restructuring-america-once.yml
          git -C shelf config user.name 'Svyable Release Automation'
          git -C shelf config user.email '129682319+Svyable@users.noreply.github.com'
          git -C shelf add README.md books/restructuring-america .github/workflows/publish-restructuring-america-once.yml
          git -C shelf diff --cached --check -- ':!books/restructuring-america/RIGHTS.md'
          git -C shelf commit -m 'Publish Restructuring America [publication-generated]'
          git -C shelf push origin HEAD:release/restructuring-america
