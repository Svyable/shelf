name: Narrow Renegade release

on:
  push:
    branches:
      - release/renegade-code-first-edition-2026-09-07

permissions:
  contents: write

jobs:
  narrow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep established Shelf release surfaces only
        run: |
          git rm -r --ignore-unmatch publication
          git restore --source=origin/main -- sitemap.xml
          rm .github/workflows/narrow-renegade-release.yml
          git config user.name "Sven Benson"
          git config user.email "129682319+Svyable@users.noreply.github.com"
          git add -A
          git commit -m "Narrow Renegade release to established Shelf contract"
          git push origin HEAD:release/renegade-code-first-edition-2026-09-07
