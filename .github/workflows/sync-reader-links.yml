name: Check publication reader links

on:
  pull_request:
    paths:
      - "books/**/README.md"
      - "catalog.json"
      - "imprint.json"
      - "scripts/sync-reader-links.py"
      - ".github/workflows/sync-reader-links.yml"
  push:
    branches:
      - main
    paths:
      - "books/**/README.md"
      - "catalog.json"
      - "imprint.json"
      - "scripts/sync-reader-links.py"
      - ".github/workflows/sync-reader-links.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-readme-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical publication Reader links
        run: python3 scripts/sync-reader-links.py --check
