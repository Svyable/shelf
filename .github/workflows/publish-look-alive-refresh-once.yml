name: Refresh Look Alive release once

on:
  push:
    branches:
      - release/look-alive

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publication-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf release branch
        uses: actions/checkout@v4
        with:
          ref: release/look-alive
          path: shelf
          fetch-depth: 0

      - name: Check out frozen Desk source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Svyable/desk.git desk
          git -C desk checkout --quiet bee7dc9d987003184ece5f2fb86d69518625b55a

      - name: Prepare release with canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python3 desk/scripts/release-book.py look-alive "$GITHUB_WORKSPACE/shelf"

      - name: Remove one-shot workflow and commit refreshed release
        shell: bash
        run: |
          set -euo pipefail
          rm -f shelf/.github/workflows/publish-look-alive-refresh-once.yml
          git -C shelf config user.name 'Svyable Release Automation'
          git -C shelf config user.email '129682319+Svyable@users.noreply.github.com'
          git -C shelf add README.md .github/ISSUE_TEMPLATE/chapter-feedback.yml books/look-alive .github/workflows/publish-look-alive-refresh-once.yml
          git -C shelf diff --cached --check -- ':!books/look-alive/RIGHTS.md' ':!books/look-alive/research/release-review.md'
          git -C shelf commit -m 'Refresh Look Alive release [publication-generated]'
          git -C shelf push origin HEAD:release/look-alive
