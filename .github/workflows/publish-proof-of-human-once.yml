name: Publish Proof of Human once

on:
  push:
    branches:
      - release/proof-of-human

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publication-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf release branch
        uses: actions/checkout@v4
        with:
          ref: release/proof-of-human
          path: shelf
          fetch-depth: 0

      - name: Check out the committed Desk snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/Svyable/desk.git desk
          git -C desk checkout --quiet aed3db84d53de2291b3c1ddf857902a2dcf38e15

      - name: Prepare the Shelf release with the canonical helper
        shell: bash
        run: |
          set -euo pipefail
          python3 desk/scripts/release-book.py proof-of-human "$GITHUB_WORKSPACE/shelf"

      - name: Remove one-shot workflow and commit generated release
        shell: bash
        run: |
          set -euo pipefail
          rm -f shelf/.github/workflows/publish-proof-of-human-once.yml
          git -C shelf config user.name 'Svyable Release Automation'
          git -C shelf config user.email '129682319+Svyable@users.noreply.github.com'
          git -C shelf add README.md books/proof-of-human .github/workflows/publish-proof-of-human-once.yml
          git -C shelf diff --cached --check -- ':!books/proof-of-human/RIGHTS.md'
          git -C shelf commit -m 'Publish Proof of Human [publication-generated]'
          git -C shelf push origin HEAD:release/proof-of-human
