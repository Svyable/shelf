name: Neuralase release transport

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Shelf release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: shelf
          fetch-depth: 0
      - name: Check out frozen Desk release source
        uses: actions/checkout@v4
        with:
          repository: Svyable/desk
          ref: 2d585b74f16887203047687dae5381c9139a48f5
          path: desk
      - name: Prepare byte-verified Shelf release
        run: python3 desk/scripts/release-book.py neuralase shelf
      - name: Add Neuralase feedback coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('shelf/.github/ISSUE_TEMPLATE/chapter-feedback.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          book_id = next(i for i, line in enumerate(lines) if line.strip() == 'id: book')
          options = next(i for i in range(book_id + 1, len(lines)) if lines[i].strip() == 'options:')
          end = options + 1
          prefix = '        - '
          while end < len(lines) and lines[end].startswith(prefix):
              end += 1
          values = [line[len(prefix):].strip() for line in lines[options + 1:end]]
          if 'neuralase' not in values:
              values.append('neuralase')
          values = sorted(values)
          lines[options + 1:end] = [f'{prefix}{value}\n' for value in values]
          path.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Verify Shelf feedback catalog
        run: python3 shelf/scripts/check-feedback-catalog.py
      - name: Commit release and remove temporary transport workflow
        run: |
          cd shelf
          rm .github/workflows/neuralase-release-transport.yml
          git config user.name 'Sven Benson'
          git config user.email '129682319+Svyable@users.noreply.github.com'
          git add README.md catalog.json books/neuralase .github/ISSUE_TEMPLATE/chapter-feedback.yml .github/workflows/neuralase-release-transport.yml
          git commit -m 'Publish Neuralase first edition' -m 'Publish Sven Hardy Benson’s Neuralase from frozen Desk source 2d585b74f16887203047687dae5381c9139a48f5 after the exact book-length gate passed. Preserve manuscript, research, and rights bytes; transform only Shelf publication metadata and discovery/feedback coverage.'
          git push origin HEAD:${{ github.head_ref }}
