name: Shelf ownership boundary

on:
  pull_request:
    paths:
      - "books/**"
      - "catalog.json"
      - "README.md"
      - "imprint.json"
      - "desk/**"
      - "reader/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "books/**"
      - "catalog.json"
      - "README.md"
      - "imprint.json"
      - "desk/**"
      - "reader/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Shelf publication and Reader ownership boundary
        run: python3 scripts/check-shelf-boundary.py
      - name: Verify release provenance for pull request changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-release-provenance.py --changed-from "${{ github.event.pull_request.base.sha }}"
      - name: Verify release provenance for pushed changes
        if: github.event_name == 'push'
        run: python3 scripts/check-release-provenance.py --changed-from "${{ github.event.before }}"
      - name: Verify existing release provenance
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-release-provenance.py
