name: Prepare Renegade Code release

on:
  push:
    branches:
      - release/renegade-code-first-edition-2026-09-07

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch frozen Desk source
        run: |
          git clone --filter=blob:none https://github.com/Svyable/desk.git /tmp/desk
          git -C /tmp/desk checkout cba805b0301f78f591c67c5d7f8c303304da108c
      - name: Prepare exact Shelf snapshot
        run: |
          python3 /tmp/desk/scripts/release.py renegade-code "$GITHUB_WORKSPACE"
          python3 scripts/sync-reader-links.py
      - name: Verify frozen-source content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src = Path('/tmp/desk/books/renegade-code')
          dst = Path('books/renegade-code')
          def manifest(root):
              out = {}
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  rel = p.relative_to(root).as_posix()
                  if rel in {'.DS_Store','README.md'}:
                      continue
                  out[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          if manifest(src) != manifest(dst):
              raise SystemExit('Shelf non-README snapshot differs from frozen Desk source')
          text = (dst/'README.md').read_text()
          if '| **Status** | Published |' not in text:
              raise SystemExit('Shelf status is not Published')
          if 'Published edition · Shelf Reader' not in text or 'Working edition · Desk Reader' in text:
              raise SystemExit('Shelf reader link normalization failed')
          print(f"verified {len(manifest(src))} non-README publication files")
          PY
      - name: Finalize release branch without workflow
        run: |
          rm .github/workflows/prepare-renegade-release.yml
          git config user.name "Sven Benson"
          git config user.email "129682319+Svyable@users.noreply.github.com"
          git add -A
          git commit -m "Publish Renegade Code — first edition"
          git push origin HEAD:release/renegade-code-first-edition-2026-09-07
