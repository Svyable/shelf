name: Sync title-page Reader from Bookself

on:
  push:
    branches:
      - sync-reader-title-pages

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-reader-title-pages
      - name: Sync shared title-page runtime
        run: |
          curl -fsSL https://raw.githubusercontent.com/Svyable/bookself/main/reader/js/app.js -o reader/js/app.js
          curl -fsSL https://raw.githubusercontent.com/Svyable/bookself/main/reader/js/experience.js -o reader/js/experience.js
          curl -fsSL https://raw.githubusercontent.com/Svyable/bookself/main/reader/js/title-page.js -o reader/js/title-page.js
          curl -fsSL https://raw.githubusercontent.com/Svyable/bookself/main/reader/css/title-page.css -o reader/css/title-page.css
          python3 - <<'PY'
          from pathlib import Path
          path = Path('reader/index.html')
          text = path.read_text(encoding='utf-8')
          line = '  <link rel="stylesheet" href="css/title-page.css?v=r1">\n'
          if line not in text:
              anchor = '  <link rel="stylesheet" href="css/style.css?v=r11">\n'
              if anchor not in text:
                  raise SystemExit('style.css link anchor not found')
              text = text.replace(anchor, anchor + line, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate shared Reader sync
        run: |
          node --check reader/js/title-page.js
          node --check reader/js/app.js
          node --check reader/js/experience.js
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import { isTitlePageChapter } from './reader/js/title-page.js';
          assert.equal(isTitlePageChapter({id:'front-matter',title:'Front Matter'}, {}), true);
          const first={id:'book',title:'Manuscript',markdown:'# Example\n\n*Subtitle*\n\n**Author**\n\n---\n'};
          assert.equal(isTitlePageChapter(first,{title:'Example',authors:'Author',chapters:[first]}), true);
          EOF
          grep -F 'css/title-page.css?v=r1' reader/index.html
          git diff --check
      - name: Commit shared Reader sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader
          git commit -m "Sync canonical title-page Reader treatment"
          git push origin HEAD:sync-reader-title-pages
