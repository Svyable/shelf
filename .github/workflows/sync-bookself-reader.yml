name: Sync Bookself Reader

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-bookself-reader.yml"
      - "reader/**"
      - "scripts/sync-ui.sh"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-bookself-reader
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Shelf
        uses: actions/checkout@v4
        with:
          path: shelf
          fetch-depth: 0
      - name: Check out Bookself
        uses: actions/checkout@v4
        with:
          repository: Svyable/bookself
          path: bookself
          fetch-depth: 1
      - name: Safely sync the current Reader engine
        working-directory: shelf
        run: sh scripts/sync-ui.sh ../bookself
      - name: Verify Shelf ownership boundary
        working-directory: shelf
        run: python3 scripts/check-shelf-boundary.py
      - name: Parse Shelf-owned boot files
        working-directory: shelf
        run: |
          cp reader/js/app.js /tmp/shelf-app.mjs
          node --check /tmp/shelf-app.mjs
          node --check reader/js/app-core.js
          node --check reader/sw.js
      - name: Run Reader contract tests
        working-directory: shelf
        run: |
          set -e
          for test in reader/js/*.test.mjs; do
            node --test "$test"
          done
      - name: Commit synchronized Reader when changed
        working-directory: shelf
        run: |
          if git diff --quiet -- reader; then
            echo "Shelf Reader already matches current Bookself runtime."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader
          git commit -m "Sync current Bookself Reader runtime"
          git push origin HEAD:main
